name: Build Minecraft Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10'
      - name: Generate Wrapper & Build
        run: |
          cd Tru1sClient_Fabric_1.21.1_Source
          gradle wrapper
          ./gradlew build
      - name: Upload Jar File
        uses: actions/upload-artifact@v4
        with:
          name: tru1sclient-mod
          path: Tru1sClient_Fabric_1.21.1_Source/build/libs/*.jar
