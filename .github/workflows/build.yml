name: Build Minecraft Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Find and build project
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Kunde inte hitta gradlew!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew build
      - name: Upload Jar File
        uses: actions/upload-artifact@v4
        with:
          name: tru1sclient-mod
          path: "**/build/libs/*.jar"
